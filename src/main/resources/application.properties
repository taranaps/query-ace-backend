spring.application.name=Query-Application

# mysql properties
spring.datasource.url = ${DB_URL:jdbc:mysql://localhost:3306/queryone?useSSL=false}
spring.datasource.username = ${DB_USERNAME}
spring.datasource.password = ${DB_PASSWORD}

